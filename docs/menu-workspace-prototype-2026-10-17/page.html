<title>LABULA Workspace 2.0 — interactive design</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23b7262c'/%3E%3Ctext x='17' y='46' font-size='43' font-family='Arial' font-weight='bold' fill='white'%3EL%3C/text%3E%3C/svg%3E">
<style>:root {
  font-family: Arial, Helvetica, sans-serif;
  color: #25282d;
  background: #f4f5f7;
  font-synthesis: none;
  --red: #bf2632;
  --red-dark: #a31f2a;
  --red-soft: #fbedef;
  --surface: #ffffff;
  --canvas: #f4f5f7;
  --line: #e0e3e8;
  --line-soft: #eceef1;
  --muted: #68707d;
  --green: #286747;
  --green-soft: #edf6f0;
  --amber: #8a5c15;
  --amber-soft: #fff6e7;
  --radius: 7px;
  --detail-width: 360px;
}

* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-size: 14px; line-height: 1.4; }
button, input, select, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .46; }
button, input, select, textarea, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid #bd5d69; outline-offset: 3px; }
a { color: var(--red); text-underline-offset: 3px; }
button { transition: background-color 100ms ease, border-color 100ms ease; }
input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: var(--red); cursor: pointer; flex: 0 0 auto; vertical-align: middle; }
input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
input, select, textarea { color: #25282d; }
input::placeholder, textarea::placeholder { color: #7b818b; opacity: 1; }
svg { display: block; flex: 0 0 auto; }
.icon { width: 17px; height: 17px; display: inline-block; flex-shrink: 0; vertical-align: middle; }
.hidden, [hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.muted, .subtle { color: var(--muted); }

.prototype-bar { min-height: 26px; padding: 3px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: 0 0 auto; background: #282d36; color: #e6e9ef; font-size: 11px; line-height: 1.5; }
.prototype-bar strong { color: #fff; font-weight: 600; }
.prototype-tools { display: flex; align-items: center; gap: 12px; white-space: nowrap; flex-shrink: 0; }
.prototype-tools button { padding: 0; background: none; border: 0; color: #fff; text-decoration: underline; text-decoration-color: #818894; text-underline-offset: 3px; font-size: 11px; }
.prototype-tools button:hover { text-decoration-color: #fff; }
.app-shell { display: flex; flex: 1; flex-direction: column; min-height: 0; min-width: 0; }
.app-header { height: 54px; min-height: 54px; display: flex; align-items: center; gap: 28px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; gap: 14px; align-items: center; white-space: nowrap; }
.wordmark { color: var(--red); font-size: 28px; font-weight: 800; letter-spacing: -1.6px; line-height: 1; }
.product-name { padding-left: 14px; border-left: 1px solid #d6dae1; color: #555d6b; font-size: 13px; line-height: 18px; }
.primary-nav { display: flex; gap: 4px; align-items: center; height: 100%; }
.primary-nav button { min-height: 40px; border: 0; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 8px 18px; background: transparent; color: #57606e; font-size: 14px; }
.primary-nav button:hover { background: #f4f5f7; }
.primary-nav button.active { background: var(--red-soft); color: var(--red); font-weight: 600; }
.primary-nav .icon { width: 18px; height: 18px; }
.header-actions { margin-left: auto; display: flex; align-items: center; gap: 13px; color: var(--muted); font-size: 12px; }
.account-label { display: inline-flex; align-items: center; gap: 7px; }
.account-dot { width: 6px; height: 6px; background: #6d8b77; border-radius: 50%; }

.workspace { display: flex; flex: 1; flex-direction: column; min-height: 0; min-width: 0; padding: 10px 18px 14px; gap: 8px; }
.page-heading { min-height: 32px; flex: 0 0 auto; display: flex; align-items: center; gap: 24px; }
.page-heading h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.65px; line-height: 1.2; }
.subnav { display: flex; gap: 3px; padding: 3px; background: #e9ecf0; border-radius: 6px; }
.subnav button { min-height: 28px; border: 0; border-radius: 4px; padding: 5px 14px; color: #626a76; background: transparent; font-size: 12px; font-weight: 600; white-space: nowrap; }
.subnav button:hover { color: #333943; background: #f3f4f6; }
.subnav button.active { color: var(--red); background: white; box-shadow: 0 1px 3px #1a23300d; }
.heading-actions { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.save-state { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.save-state .icon { width: 13px; height: 13px; color: var(--green); }
.save-state.dirty { color: var(--amber); }

.health-bar { min-height: 44px; flex: 0 0 auto; display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.health-bar button.metric { min-width: 0; min-height: 44px; flex: 1; display: flex; align-items: center; gap: 8px; padding: 7px 16px; border: 0; border-right: 1px solid var(--line-soft); background: transparent; text-align: left; color: #565f6b; font-size: 12px; line-height: 1.3; }
.health-bar button.metric:last-child { border-right: 0; }
.health-bar button.metric:hover { background: #f8f9fb; }
.metric b, .metric strong { display: block; color: #29313b; font-size: 22px; font-weight: 600; letter-spacing: -.7px; line-height: 1; white-space: nowrap; }
.metric small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.3; }
.metric .metric-copy { min-width: 0; }
.metric .metric-title { display: block; font-weight: 600; color: #434b58; }
.health-bar .metric.active { background: #fbedef; box-shadow: inset 0 -2px var(--red); }
.health-bar .metric.warn b, .health-bar .metric.warn strong { color: var(--amber); }
.health-bar .metric.good b, .health-bar .metric.good strong { color: var(--green); }
.health-label { display: flex; flex-direction: column; justify-content: center; width: 132px; flex-shrink: 0; padding: 7px 14px; color: #4f5866; font-size: 11px; font-weight: 600; border-right: 1px solid var(--line-soft); }
.health-label small { color: var(--muted); font-weight: 400; font-size: 10px; margin-top: 2px; }

.workbench { display: grid; grid-template-columns: minmax(0, 1fr) var(--detail-width); gap: 12px; min-height: 0; min-width: 0; flex: 1; }
.list-panel, .detail-panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.list-toolbar { display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 6px 10px; flex-shrink: 0; border-bottom: 1px solid var(--line-soft); }
.search-field { display: flex; align-items: center; position: relative; flex: 1; min-width: 100px; }
.search-field .icon { position: absolute; left: 9px; width: 15px; height: 15px; color: #7b8290; pointer-events: none; }
.search-field input { width: 100%; height: 30px; border: 1px solid #dce0e6; background: white; border-radius: 4px; padding: 5px 9px 5px 30px; font-size: 12px; }
.search-field:not(:has(.icon)) input { padding-left: 10px; }
.filter-select { height: 30px; max-width: 178px; min-width: 100px; border: 1px solid #dce0e6; background: white; border-radius: 4px; padding: 5px 25px 5px 8px; font-size: 11px; cursor: pointer; }
.search-key { position: absolute; right: 9px; top: 6px; color: #8a919d; background: #f6f7f9; border: 1px solid #e3e6eb; border-radius: 3px; padding: 0 4px; line-height: 17px; font-size: 11px; }
.list-caption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 12px; min-height: 24px; border-bottom: 1px solid var(--line-soft); color: var(--muted); font-size: 11px; flex: 0 0 auto; }
.list-caption strong { color: #4a5361; font-weight: 600; }
.list-caption button { border: 0; background: transparent; color: var(--red); font-size: inherit; padding: 0; }
.list-caption .active-filter { color: var(--red); }
.table-scroll { overflow: auto; min-height: 0; min-width: 0; flex: 1; overscroll-behavior: contain; scrollbar-gutter: stable; }
.data-table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; font-size: 13px; table-layout: fixed; }
.data-table th { position: sticky; top: 0; z-index: 2; padding: 5px 10px; height: 28px; background: #f7f8fa; color: #6b7380; font-size: 10px; font-weight: 500; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data-table th button { border: 0; padding: 0; background: none; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; }
.data-table td { padding: 6px 10px; height: 44px; vertical-align: middle; border-bottom: 1px solid var(--line-soft); overflow-wrap: anywhere; }
.data-table th:first-child, .data-table td:first-child { width: 35px; padding-left: 12px; padding-right: 7px; }
.data-table th.name-column { width: 34%; }
.data-table th.category-column { width: 17%; }
.data-table th.menu-column { width: 13%; }
.data-table th.composition-column { width: 23%; }
.data-table th.count-column { width: 13%; }
.data-table tbody tr:hover td { background: #fafbfc; }
.data-table tbody tr.selected td { background: #fff2f3; }
.data-table tbody tr.selected td:first-child { box-shadow: inset 3px 0 var(--red); }
.data-table tbody tr.checked:not(.selected) td { background: #faf6f7; }
.data-table .name-cell { min-width: 0; }
.name-cell button, .row-open, .row-title { border: 0; background: none; padding: 0; text-align: left; color: #2e333b; font-size: 13px; font-weight: 600; line-height: 1.25; }
.name-cell button:hover, .row-open:hover, .row-title:hover { color: var(--red); }
.row-title { display: block; }
.row-subtitle { display: block; font-size: 11px; color: #7b828d; font-weight: 400; line-height: 1.25; margin-top: 3px; }
.row-open { display: block; width: 100%; }
.row-open button { border: 0; background: none; padding: 0; color: inherit; font: inherit; }
.data-table .count { font-variant-numeric: tabular-nums; color: #5d6673; font-size: 12px; }
.data-table .group-row td { height: 26px; background: #f9fafb; color: #7b828e; font-size: 10px; font-weight: 600; letter-spacing: .035em; text-transform: uppercase; }
.table-footnote { min-height: 29px; padding: 7px 12px; border-top: 1px solid var(--line-soft); color: #7b828d; font-size: 10px; flex-shrink: 0; }
.selection-bar { display: flex; align-items: center; flex-wrap: wrap; justify-content: space-between; gap: 8px; flex: 0 0 auto; min-height: 46px; padding: 8px 11px; background: #faf3f4; border-top: 1px solid #ecd8dc; }
.selection-summary { font-size: 12px; color: #793a43; }
.selection-summary strong { font-weight: 600; }
.selection-summary small { display: inline-block; color: #865c64; font-size: 10px; margin-left: 5px; }
.selection-summary button { border: 0; background: none; padding: 0 0 0 5px; color: var(--red); font-size: 11px; text-decoration: underline; text-underline-offset: 2px; }
.selection-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
.selection-actions .button { min-height: 28px; padding: 4px 8px; font-size: 11px; }

.detail-header { flex-shrink: 0; padding: 13px 15px 12px; border-bottom: 1px solid var(--line); background: #fff; }
.breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; min-height: 16px; margin-bottom: 12px; color: #88909c; font-size: 10px; line-height: 1.4; }
.breadcrumbs button { border: 0; background: none; padding: 0; color: var(--red); font-size: inherit; max-width: 100%; text-align: left; }
.breadcrumbs .icon { width: 11px; height: 11px; color: #9ba1ab; }
.eyebrow { margin: 0 0 5px; color: #737c89; text-transform: uppercase; letter-spacing: .075em; font-size: 9px; font-weight: 700; }
.detail-header h2 { margin: 0; color: #272d35; font-size: 21px; line-height: 1.2; font-weight: 600; letter-spacing: -.6px; overflow-wrap: anywhere; }
.detail-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 9px; }
.detail-scroll { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; padding: 0 15px; scrollbar-gutter: stable; }
.detail-section { padding: 15px 0; border-bottom: 1px solid var(--line-soft); }
.detail-section:last-child { border-bottom: 0; }
.detail-section h3 { margin: 0 0 9px; font-size: 12px; color: #424a56; font-weight: 600; }
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; font-size: 12px; color: #424a56; font-weight: 600; }
.section-title h3 { margin: 0; }
.section-title small { color: #8a909a; font-size: 10px; font-weight: 400; }
.section-description { margin: 0 0 11px; color: var(--muted); font-size: 11px; line-height: 1.55; }
.field { display: block; margin-bottom: 11px; }
.field:last-child { margin-bottom: 0; }
.field label, label.field > span, .form-field label { display: block; margin: 0 0 5px; color: #606977; font-size: 11px; font-weight: 500; }
.field input:not([type="checkbox"]), .field textarea, .field select, .form-field input:not([type="checkbox"]), .form-field textarea, .form-field select { width: 100%; min-width: 0; height: 33px; border: 1px solid #dce0e6; border-radius: 4px; padding: 6px 9px; background: #fff; font-size: 12px; line-height: 1.4; }
.field textarea, .form-field textarea { height: 62px; min-height: 50px; resize: vertical; }
.field small, .form-field small { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.5; }
.field-inline { display: flex; align-items: center; gap: 8px; }
.field-inline label { margin-bottom: 0; }
.composition-list { display: flex; flex-direction: column; gap: 6px; }
.composition-row { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 7px 8px; background: #fff; border: 1px solid #e5e8ed; border-radius: 5px; }
.component-type { flex: 0 0 27px; width: 27px; height: 27px; border-radius: 5px; display: flex; align-items: center; justify-content: center; background: #f0f2f5; color: #7a8391; font-size: 10px; font-weight: 600; }
.component-type.house, .component-type.house-made { background: #fbedef; color: var(--red); }
.component-type .icon { width: 15px; height: 15px; }
.component-info { flex: 1; min-width: 0; }
.component-info button { display: block; width: 100%; color: #333b46; background: none; border: 0; padding: 0; text-align: left; font-size: 12px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.component-info button:hover { color: var(--red); }
.component-info small { display: block; color: #7b8290; font-size: 10px; line-height: 1.3; margin-top: 3px; }
.component-info small.warning { color: var(--amber); }
.remove-button { border: 0; background: transparent; flex: 0 0 25px; width: 25px; height: 27px; padding: 5px; border-radius: 4px; color: #8b939e; display: flex; align-items: center; justify-content: center; }
.remove-button:hover { color: var(--red); background: var(--red-soft); }
.remove-button .icon { width: 14px; height: 14px; }
.add-component { margin-top: 9px; width: 100%; justify-content: center; border-style: dashed !important; }
.confirmation-check { display: flex; align-items: flex-start; gap: 8px; padding: 11px 0 0; color: #596372; font-size: 11px; line-height: 1.5; }
.confirmation-check input { margin-top: 2px; }
.confirmation-check strong { display: block; color: #38434e; font-size: 11px; font-weight: 600; }
.confirmation-check small { display: block; font-size: 10px; color: #7b8491; margin-top: 2px; }
.status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 500; color: #6c7582; white-space: normal; line-height: 1.35; }
.status-badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex: 0 0 5px; }
.status-badge.good { color: var(--green); }
.status-badge.warn { color: var(--amber); }
.status-badge.muted { color: #7a838f; }
.status-badge.danger { color: #aa2936; }
.detail-badges .status-badge { padding: 3px 6px; border-radius: 4px; background: #f3f5f7; }
.detail-badges .status-badge.good { background: var(--green-soft); }
.detail-badges .status-badge.warn { background: var(--amber-soft); }
.detail-badges .status-badge.danger { background: var(--red-soft); }
.notice { margin: 10px 0 0; padding: 9px 10px; color: #657181; background: #f5f7fa; border: 1px solid #e5e9ef; border-radius: 5px; font-size: 11px; line-height: 1.5; }
.notice strong { font-weight: 600; }
.notice p { margin: 0; }
.notice p + p { margin-top: 5px; }
.notice.warning { color: #8b631e; background: #fff9ed; border-color: #efe1bc; }
.notice.success { color: #416e52; background: #f1f7f3; border-color: #dcebe1; }
.notice button { border: 0; background: transparent; padding: 0; color: inherit; text-align: left; text-decoration: underline; text-underline-offset: 2px; font: inherit; }
.notice .button { margin-top: 7px; text-decoration: none; }
.usage-list { list-style: none; margin: 0; padding: 0; }
.usage-row { min-height: 29px; display: flex; gap: 9px; align-items: flex-start; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #f0f2f5; font-size: 11px; }
.usage-row:last-child { border-bottom: 0; }
.usage-row button { border: 0; background: none; padding: 0; color: #495361; text-align: left; font-size: 11px; line-height: 1.4; }
.usage-row button:hover { color: var(--red); }
.usage-row small { color: #8b929d; font-size: 10px; white-space: nowrap; }
.usage-row .via { display: block; color: #8b929d; font-size: 10px; margin-top: 2px; }
.detail-footer { flex: 0 0 auto; padding: 10px 12px; border-top: 1px solid var(--line); background: #fafbfc; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 7px; }
.footer-state { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #7b8390; }
.footer-state.dirty { color: var(--amber); }
.footer-state .icon { width: 12px; height: 12px; }
.footer-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.footer-actions .button { min-height: 31px; padding: 6px 9px; font-size: 11px; }
.mobile-back { display: none; }

.button { min-height: 32px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; border: 1px solid #dce0e6; border-radius: 5px; background: white; color: #4e5866; font-size: 12px; font-weight: 500; line-height: 1.35; text-decoration: none; white-space: nowrap; }
.button:hover:not(:disabled) { background: #f7f8fa; border-color: #c8cdd5; }
.button.primary, button.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
.button.primary:hover:not(:disabled), button.primary:hover:not(:disabled) { background: var(--red-dark); border-color: var(--red-dark); }
.button.secondary { background: #fff; color: #525c6a; }
.button.ghost { border-color: transparent; background: transparent; color: #68717f; }
.button.ghost:hover:not(:disabled) { background: #eceff3; }
.button.small { min-height: 27px; padding: 4px 8px; font-size: 11px; }
.button.danger { color: #a72b38; border-color: #e6c9ce; }
.button .icon { width: 14px; height: 14px; }
.icon-button { width: 29px; height: 29px; display: inline-flex; align-items: center; justify-content: center; padding: 5px; background: transparent; border: 1px solid transparent; border-radius: 5px; color: #7a8390; }
.icon-button:hover { background: #eff1f4; }
.empty-state { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; padding: 28px 20px; color: #818995; text-align: center; font-size: 12px; line-height: 1.6; }
.empty-state h3 { margin: 0 0 5px; color: #586271; font-size: 14px; font-weight: 500; }
.empty-state p { max-width: 260px; margin: 0; }
.empty-state .icon { width: 30px; height: 30px; margin-bottom: 13px; color: #a7adb7; }
.empty-state .button { margin-top: 13px; }
.empty-composition { margin-bottom: 9px; border: 1px dashed #dce0e7; border-radius: 5px; padding: 15px; font-size: 11px; line-height: 1.6; color: #828b98; text-align: center; }

.dialog-backdrop { position: fixed; inset: 0; z-index: 50; background: #1d263d66; display: flex; align-items: center; justify-content: center; padding: 24px; backdrop-filter: blur(2px); }
.dialog { background: #fff; width: 470px; max-width: 100%; max-height: min(760px, 90dvh); border-radius: 10px; box-shadow: 0 16px 70px #1821343d; border: 1px solid #d8dce3; display: flex; flex-direction: column; overflow: hidden; }
.dialog.wide { width: 680px; }
.dialog-header { display: flex; align-items: center; gap: 12px; padding: 17px 20px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
.dialog-header h2 { margin: 0; font-size: 18px; letter-spacing: -.4px; font-weight: 600; color: #2d3541; }
.dialog-header .icon-button { margin-left: auto; }
.dialog-header p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
.dialog-body { padding: 17px 20px; overflow: auto; min-height: 0; font-size: 12px; }
.dialog-body > p:first-child { margin-top: 0; }
.dialog-body p { color: #697382; font-size: 12px; line-height: 1.6; }
.dialog-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; background: #fafbfc; border-top: 1px solid var(--line); flex-shrink: 0; }

<body>
<div class="prototype-bar" lang="cs"><span><strong>Klikací návrh</strong><span class="prototype-description"> · skutečné názvy jídel, ukázkové složení · změny pouze v prototypu</span></span><div class="prototype-tools"><button data-action="guide">Co vyzkoušet</button><button data-action="reset">Obnovit ukázku</button></div></div>
<div class="app-shell">
<header class="app-header"><button class="brand" data-action="area" data-id="menu" aria-label="LABULA Workspace 2.0"><span class="wordmark">LABULA</span><span class="product-name">Workspace 2.0</span></button><nav class="primary-nav" aria-label="Main navigation"><button data-action="area" data-id="today" id="nav-today"></button><button data-action="area" data-id="menu" id="nav-menu"></button></nav><div class="header-actions"><button class="button ghost" data-action="settings" id="settings-button"></button><span class="avatar" aria-label="Demo user">JL</span></div></header>
<main class="workspace" id="workspace"></main>
</div>
<div id="dialogs"></div><div class="toast-region" id="toasts" aria-live="polite" aria-atomic="true"></div>
<script>/* LABULA Workspace 2.0 clickable design prototype.
 * Dish names/variants follow lib/menu.ts; all compositions and check data are
 * synthetic examples, not the restaurant's recorded recipes or inventory.
 * No network, persistence or production application code is used here.
 */
(function (root) {
  'use strict';

  const clone = value => JSON.parse(JSON.stringify(value));
  const normalize = value => String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  const values = data => Object.values(data && data.entities || {});
  const entity = (data, id) => data && data.entities && data.entities[id];
  const ref = (id, amount = '', note = '') => ({id, amount, note});

  function children(data, id) {
    const item = entity(data, id);
    if (!item || item.type === 'ingredient') return [];
    return [...new Set((item.inputs || []).map(input => input.id).filter(Boolean))];
  }

  function descendants(data, id) {
    const seen = new Set([id]);
    const result = [];
    function visit(parentId) {
      for (const childId of children(data, parentId)) {
        if (seen.has(childId)) continue;
        seen.add(childId);
        result.push(childId);
        visit(childId);
      }
    }
    visit(id);
    return result;
  }

  function activeRecipes(data) {
    return values(data).filter(item => item.type === 'dish' && item.active === true);
  }

  function ownState(item) {
    if (!item) return 'empty';
    if (item.type === 'ingredient') return 'confirmed';
    if (!item.inputs || !item.inputs.length) return 'empty';
    return item.confirmed ? 'confirmed' : 'draft';
  }

  function issues(data, id) {
    const found = new Map();
    const visited = new Set();
    const path = new Set();
    function add(itemId, reason) { found.set(itemId + ':' + reason, {id: itemId, reason}); }
    function visit(itemId) {
      if (path.has(itemId)) { add(itemId, 'Circular composition reference'); return; }
      if (visited.has(itemId)) return;
      const item = entity(data, itemId);
      if (!item) { add(itemId, 'Referenced item is unavailable'); return; }
      if (item.type === 'ingredient') { visited.add(itemId); return; }
      path.add(itemId);
      if (ownState(item) === 'empty') add(itemId, 'No components added yet');
      else if (!item.confirmed) add(itemId, 'Composition not confirmed');
      for (const childId of children(data, itemId)) {
        const child = entity(data, childId);
        if (child && child.type === 'dish') add(childId, 'A dish cannot be used as a component');
        visit(childId);
      }
      path.delete(itemId);
      visited.add(itemId);
    }
    visit(id);
    return [...found.values()];
  }

  function complete(data, id) { return Boolean(entity(data, id)) && issues(data, id).length === 0; }

  function activeUses(data, id) {
    return activeRecipes(data).filter(item => item.id !== id && descendants(data, item.id).includes(id));
  }

  function parents(data, id) {
    return values(data).filter(item => children(data, item.id).includes(id));
  }

  function usedItems(data, type) {
    const reachable = new Set(activeRecipes(data).flatMap(item => descendants(data, item.id)));
    return values(data).filter(item => item.type === type && reachable.has(item.id));
  }

  function usedIngredients(data) { return usedItems(data, 'ingredient'); }
  function usedHouseMade(data) { return usedItems(data, 'house'); }

  function health(data) {
    const active = activeRecipes(data);
    const broken = new Set();
    for (const recipe of active) {
      for (const issue of issues(data, recipe.id)) {
        if (issue.reason === 'Circular composition reference' || issue.reason === 'Referenced item is unavailable' || issue.reason === 'A dish cannot be used as a component') {
          broken.add(issue.id + ':' + issue.reason);
        }
      }
    }
    return {
      activeVariants: active.length,
      totalDishes: new Set(values(data).filter(item => item.type === 'dish').map(item => item.dishId || item.id)).size,
      completeVariants: active.filter(item => complete(data, item.id)).length,
      ownToCheck: active.filter(item => ownState(item) !== 'confirmed').length,
      houseToCheck: usedHouseMade(data).filter(item => ownState(item) !== 'confirmed').length,
      broken: broken.size,
    };
  }

  function wouldCycle(data, parentId, childId) {
    return parentId === childId || descendants(data, childId).includes(parentId);
  }

  function saveEntity(data, id, patch) {
    if (!id || typeof id !== 'string') throw new Error('An item ID is required.');
    const existing = entity(data, id);
    const candidate = {...(existing || {id, confirmed: false, inputs: [], notes: '', aliases: []}), ...clone(patch), id};
    if (!['dish', 'house', 'ingredient'].includes(candidate.type)) throw new Error('Choose a dish, house-made item or ingredient.');
    candidate.name = String(candidate.name || '').trim();
    if (!candidate.name) throw new Error('Add a name before saving.');
    candidate.notes = String(candidate.notes || '');
    candidate.aliases = [...new Set((candidate.aliases || []).map(value => String(value).trim()).filter(Boolean))];
    if (!Array.isArray(candidate.inputs)) throw new Error('The component list is invalid.');
    candidate.inputs = candidate.inputs.map(input => ({id: String(input.id || ''), amount: String(input.amount || ''), note: String(input.note || '')}));
    const duplicate = values(data).find(item => item.id !== id && item.type === candidate.type && normalize(item.name) === normalize(candidate.name) && (candidate.type !== 'dish' || normalize(item.variant || 'Standard') === normalize(candidate.variant || 'Standard')));
    if (duplicate) throw new Error('An item with this name already exists. Choose the existing item or a different name.');
    if (candidate.type === 'ingredient' && candidate.inputs.length) throw new Error('A bought ingredient does not need a house-made composition.');
    const seen = new Set();
    for (const input of candidate.inputs) {
      if (!input.id || !entity(data, input.id)) throw new Error('A component is unavailable. Choose an existing item.');
      if (seen.has(input.id)) throw new Error('This component is already in the list.');
      seen.add(input.id);
      if (entity(data, input.id).type === 'dish') throw new Error('Choose an ingredient or a house-made item as the component.');
      if (wouldCycle(data, id, input.id)) throw new Error('This would create a circular recipe. Choose another component.');
    }
    const changedInputs = JSON.stringify(existing && existing.inputs || []) !== JSON.stringify(candidate.inputs);
    if (candidate.type === 'ingredient') candidate.confirmed = true;
    else {
      if (changedInputs && patch.confirmed !== true) candidate.confirmed = false;
      candidate.confirmed = candidate.confirmed === true;
      if (candidate.confirmed && !candidate.inputs.length) throw new Error('Add at least one component before confirming the list.');
    }
    if (candidate.type === 'dish') {
      candidate.active = candidate.active === true;
      candidate.dishId = candidate.dishId || id;
      candidate.variant = candidate.variant || 'Standard';
    }
    // No mutation of an editor draft, input array or the saved snapshot.
    // Frozen copies make accidental edits of the saved composition observable.
    candidate.inputs = Object.freeze(candidate.inputs.map(input => Object.freeze({...input})));
    const next = clone(data);
    next.entities[id] = candidate;
    next.revision = Number(data.revision || 0) + 1;
    return next;
  }

  function seed() {
    const entities = {};
    function ingredient(id, name, group, aliases = [], notes = '') {
      entities[id] = {id, type: 'ingredient', name, group, confirmed: true, inputs: [], notes, aliases};
    }
    ingredient('ingredient-silken-tofu', 'Silken tofu', 'Tofu & proteins', ['Soft tofu']);
    ingredient('ingredient-garlic', 'Garlic', 'Vegetables', ['Česnek']);
    ingredient('ingredient-oil', 'Rapeseed oil', 'Pantry', ['Oil']);
    ingredient('ingredient-chilli', 'Dried chilli', 'Spices', ['Chili']);
    ingredient('ingredient-soy', 'Light soy sauce', 'Pantry', ['Soy sauce'], 'Bought product. Supplier label belongs in product details; it does not create kitchen tasks.');
    ingredient('ingredient-vinegar', 'Rice vinegar', 'Pantry');
    ingredient('ingredient-cucumber', 'Cucumber', 'Vegetables');
    ingredient('ingredient-sesame', 'Sesame seeds', 'Pantry');
    ingredient('ingredient-sugar', 'Sugar', 'Pantry');
    ingredient('ingredient-salt', 'Salt', 'Pantry');
    ingredient('ingredient-eggplant', 'Eggplant', 'Vegetables', ['Aubergine']);
    ingredient('ingredient-starch', 'Potato starch', 'Pantry');
    ingredient('ingredient-chicken', 'Chicken', 'Tofu & proteins');
    ingredient('ingredient-ginger', 'Ginger', 'Vegetables');
    ingredient('ingredient-century-egg', 'Century egg', 'Tofu & proteins');
    ingredient('ingredient-paprika', 'Smoked paprika', 'Spices');
    ingredient('ingredient-flour', 'Wheat flour', 'Pantry');
    ingredient('ingredient-wood-ear', 'Wood ear mushroom', 'Vegetables');
    ingredient('ingredient-beef', 'Beef', 'Tofu & proteins');
    ingredient('ingredient-noodles', 'Wheat noodles', 'Noodles');
    ingredient('ingredient-sweet-noodles', 'Sweet-potato noodles', 'Noodles');
    ingredient('ingredient-pork', 'Pork', 'Tofu & proteins');
    ingredient('ingredient-cabbage', 'Chinese cabbage', 'Vegetables');
    ingredient('ingredient-firm-tofu', 'Firm tofu', 'Tofu & proteins');
    ingredient('ingredient-rice', 'Rice', 'Pantry');
    ingredient('ingredient-spring-onion', 'Spring onion', 'Vegetables');
    ingredient('ingredient-black-pepper', 'Black pepper', 'Spices');

    function house(id, name, confirmed, ids, notes = '') {
      entities[id] = {id, type: 'house', name, confirmed, inputs: ids.map(value => typeof value === 'string' ? ref(value) : value), notes, aliases: []};
    }
    house('house-garlic-paste', 'Garlic paste', true, [ref('ingredient-garlic', '500 g'), ref('ingredient-oil', '100 ml')]);
    house('house-chilli-sauce', 'Chilli sauce', false, ['house-garlic-paste', 'ingredient-chilli', 'ingredient-soy', 'ingredient-vinegar'], 'Example: check that this component list is complete.');
    house('house-cucumber-dressing', 'Cucumber dressing', true, ['house-garlic-paste', 'ingredient-vinegar', 'ingredient-soy', 'ingredient-sugar']);
    house('house-eggplant-coating', 'Eggplant coating', true, ['ingredient-starch', 'ingredient-flour', 'ingredient-salt']);
    house('house-chicken-marinade', 'Chicken marinade', true, ['house-garlic-paste', 'ingredient-ginger', 'ingredient-soy']);
    house('house-paprika-dressing', 'Smoky paprika dressing', true, ['ingredient-paprika', 'ingredient-oil', 'ingredient-vinegar']);
    house('house-dough', 'House dough', true, ['ingredient-flour', 'ingredient-oil', 'ingredient-salt']);
    house('house-mushroom-dressing', 'Mushroom dressing', false, ['ingredient-soy', 'ingredient-vinegar', 'ingredient-sesame']);
    house('house-braised-beef', 'Braised beef', true, ['ingredient-beef', 'house-garlic-paste', 'ingredient-ginger', 'ingredient-soy']);
    house('house-chicken-broth', 'Chicken broth', true, ['ingredient-chicken', 'ingredient-ginger', 'ingredient-spring-onion', 'ingredient-salt']);
    house('house-xiao-mian-base', 'Xiao Mian base', true, ['house-chilli-sauce', 'house-chicken-broth', 'ingredient-soy']);
    house('house-pickled-cabbage', 'Pickled cabbage', true, ['ingredient-cabbage', 'ingredient-salt', 'ingredient-vinegar']);
    house('house-marinated-tofu', 'Marinated tofu', true, ['ingredient-firm-tofu', 'ingredient-soy', 'ingredient-ginger']);
    house('house-mapo-base', 'Mapo base', true, ['house-chilli-sauce', 'ingredient-pork', 'ingredient-soy']);
    house('house-seasonal-dressing', 'Seasonal dressing', false, [], 'New component idea. Not used in the current menu.');

}
function trackingDialog(){const items=[...M.usedHouseMade(data),...M.usedIngredients(data)];showDialog('Items included in evening checks',`<p class="muted">Choose what the kitchen actually checks. Composition ingredients are not added automatically.</p><div class="picker-results">${items.map(e=>`<label class="picker-option"><input type="checkbox" data-track="${esc(e.id)}" ${(data.tracked||[]).includes(e.id)?'checked':''}><span><strong>${esc(e.name)}</strong><small>${typeLabel(e)}</small></span></label>`).join('')}</div>`,button('Done','close-tracking','','primary'),true);}
function publishDialog(){const list=trackedItems(),low=list.filter(e=>data.checks[e.id]==='low');if(list.some(e=>!data.checks[e.id]))return;showDialog('Publish the example morning plan?',`<p>Only the ${low.length} tracked ${low.length===1?'item marked':'items marked'} as needed will become tasks.</p><div class="preview-list">${low.map(e=>`<div class="preview-row"><strong>${esc(e.name)}</strong><span>${e.type==='house'?'Prepare':'Restock'}</span></div>`).join('')||'<p>Everything is marked as enough. The plan will have no tasks.</p>'}</div><div class="notice">The plan keeps this menu snapshot. Later composition changes will not silently rewrite these tasks.</div>${data.plan?'<p class="muted">This replaces the previous example plan and resets its Ready marks.</p>':''}`,button('Back to check','close-dialog','','ghost')+button('Publish example plan','confirm-publish','','primary'));}

document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target||target.disabled)return;const action=target.dataset.action,id=target.dataset.id;
 try{
 switch(action){
 case 'area':rememberScroll();area=id;mobileDetail=false;render();break;
 case 'tab':selectTab(id);break;
 case 'open':openRoot(id);break;
 case 'nested':openNested(id);break;
 case 'usage':openInMenu(id);break;
 case 'breadcrumb':ctx().trail=ctx().trail.slice(0,Number(id)+1);renderDetail();break;
 case 'back-list':mobileDetail=false;render();document.querySelector(`[data-row="${ctx().root}"] .row-open`)?.focus();break;
 case 'picker':openPicker(id);break;
 case 'add-picked':{const parent=picker.parent,d=draft(parent);for(const child of picker.selected)if(!d.value.inputs.some(p=>p.id===child))d.value.inputs.push({id:child,amount:'',note:''});d.value.confirmed=false;persist();closeDialog();render();break;}
 case 'remove-input':{const parent=currentId(),d=draft(parent),index=d.value.inputs.findIndex(p=>p.id===id);if(index<0)break;d.removed={part:M.clone(d.value.inputs[index]),index};d.value.inputs.splice(index,1);d.value.confirmed=false;persist();renderDetail();renderRows();break;}
 case 'undo-remove':{const d=drafts[id];if(!d?.removed)break;if(!d.value.inputs.some(p=>p.id===d.removed.part.id))d.value.inputs.splice(d.removed.index,0,d.removed.part);d.removed=null;persist();renderDetail();renderRows();break;}
 case 'save':{const e=drafts[id]?.value;if(!e)break;const next=M.saveEntity(data,id,compositionFields(e));delete drafts[id];ctx().pinned=[...new Set([...ctx().pinned,id])];commit(next);render();notify('Composition saved. Menu overview updated.');break;}
 case 'confirm':{const next=M.saveEntity(data,id,{confirmed:true});ctx().pinned=[...new Set([...ctx().pinned,id])];commit(next);render();notify('Own ingredient list confirmed');break;}
 case 'discard':delete drafts[id];persist();render();notify('Draft discarded. Saved composition kept.');break;
 case 'next':{const list=tabItems().filter(e=>e.type!=='ingredient'&&!M.complete(data,e.id));const index=list.findIndex(e=>e.id===currentId());const next=list[(index+1)%list.length];if(next){ctx().pinned.push(next.id);openRoot(next.id);}else notify('All compositions in this view are complete');break;}
 case 'metadata':metadataDialog(id);break;
 case 'new':createDialog(tab==='menu'?'dish':tab==='house'?'house':'ingredient');break;
 case 'variant':createDialog('dish',id);break;
 case 'new-in-picker':createDialog(picker?.type==='house'?'house':'ingredient',null,true);break;
 case 'toggle-menu':bulkPreview(entity(id).active?'off':'on',[id]);break;
 case 'bulk':bulkPreview(id);break;
 case 'apply-bulk':{const b=dialog.bulk;if(data.revision!==b.revision){notify('The example changed. Open the preview again.');closeDialog();break;}for(const affected of b.ids){ctx().pinned.push(affected);if(drafts[affected]&&b.action==='reopen')drafts[affected].value.confirmed=false;}saveSnapshot(b.next,'Group change applied');closeDialog();render();break;}
 case 'bulk-group':showDialog('Change ingredient group',`<form id="group-form"><p>${ctx().selected.length} selected ingredients, including items outside the current filter.</p><label class="form-field">Group<input name="group" placeholder="e.g. Vegetables" required maxlength="80"></label></form>`,button('Cancel','close-dialog','','ghost')+'<button form="group-form" type="submit" class="button primary">Save group</button>');break;
 case 'show-selected':ctx().onlySelected=!ctx().onlySelected;ctx().pinned=[];renderRows();break;
 case 'clear-selection':ctx().selected=[];ctx().onlySelected=false;renderRows();break;
 case 'reapply':ctx().pinned=[];renderRows();break;
 case 'clear-filters':Object.assign(ctx(),{scope:tab==='house'?'all':'current',status:'all',category:'all',q:'',onlySelected:false,pinned:[]});render();break;
 case 'health':area='menu';if(id==='house'){tab='house';Object.assign(ctx(),{scope:'current',status:'own-attention',q:'',category:'all',onlySelected:false,pinned:[]});}else{tab='menu';Object.assign(ctx(),{scope:'current',status:id==='lists'?'own-attention':'attention',q:'',category:'all',onlySelected:false,pinned:[]});}render();break;
 case 'issues':showIssues();break;
 case 'issue-open':closeDialog();openInMenu(id);break;
 case 'export':exportRows(rows().map(e=>e.id));break;
 case 'export-selected':exportRows(ctx().selected);break;
 case 'more':showDialog('Menu actions',`<div class="menu-actions">${button(icon('download')+'Export current view','export','','secondary')}${button(icon('alert')+'Review composition issues','issues','','secondary')}${button('How this prototype works','guide','','ghost')}</div>`,button('Close','close-dialog'));break;
 case 'undo':if(lastUndo&&lastUndo.revision===data.revision){const next=M.clone(lastUndo.data);next.revision=data.revision+1;commit(next);lastUndo=null;render();notify('Group change undone');}else notify('A newer change was saved. The earlier change can no longer be undone.');break;
 case 'dismiss-toast':$('toasts').innerHTML='';break;
 case 'close-dialog':closeDialog();break;
 case 'guide':showGuide();break;
 case 'guide-start':closeDialog();if(id==='sauce')openInMenu('house-chilli-sauce');else if(id==='nested'){area='menu';tab='menu';openRoot('dish-s1-standard');}else if(id==='house'){area='menu';selectTab('house');}else if(id==='bulk'){area='menu';tab='menu';ctx().selected=M.activeRecipes(data).slice(0,3).map(e=>e.id);render();}else if(id==='ingredients'){area='menu';openInMenu('ingredient-garlic');}else{area='today';todayView='evening';render();}break;
 case 'reset':showDialog('Obnovit ukázková data?',`<p lang="cs">Zruší se pouze změny a rozpracované návrhy v tomto prototypu. Skutečná aplikace LABULA se nemění.</p>`,button('Zpět','close-dialog','','ghost')+button('Obnovit ukázku','confirm-reset','','primary'));break;
 case 'confirm-reset':data=M.seed();drafts={};lastUndo=null;persist();for(const c of Object.values(contexts)){c.selected=[];c.pinned=[];c.onlySelected=false;c.q='';c.status='all';c.category='all';c.scroll=0;}contexts.menu.scope='current';contexts.house.scope='all';contexts.ingredients.scope='current';area='menu';tab='menu';ctx().root='dish-s1-standard';ctx().trail=[ctx().root];mobileDetail=false;closeDialog();render();notify('Ukázková data obnovena');break;
 case 'settings':showDialog('Workspace settings',`<p class="muted">This is an interactive design of LABULA Workspace 2.0.</p><dl class="metadata-list"><dt>Data</dt><dd>Illustrative compositions · real menu names</dd><dt>Changes</dt><dd>${localAvailable?'Saved only in this browser’s prototype storage':'Kept only in this session'}</dd><dt>Layout</dt><dd>Compact desktop · always-visible detail</dd><dt>Production</dt><dd>No connection to the live kitchen data</dd></dl><div class="notice">Use the guide to try the main workflows. Reset restores the example data.</div>`,button('Open guide','guide','','secondary')+button('Close','close-dialog','','primary'));break;
 case 'today-tab':todayView=id;mobileDetail=false;render();break;
 case 'today-select':todaySelected=id;mobileDetail=true;render();if(matchMedia('(max-width: 559px)').matches)document.querySelector('.detail-header h2')?.focus();else if(matchMedia('(max-width: 759px)').matches)document.querySelector('.detail-panel')?.scrollIntoView({block:'nearest'});break;
 case 'check-enough':case 'check-low':{const next=M.clone(data);next.checks[id]=action==='check-enough'?'enough':'low';next.revision++;commit(next);todaySelected=id;render();break;}
 case 'tracking':trackingDialog();break;
 case 'close-tracking':closeDialog();render();break;
 case 'publish-plan':publishDialog();break;
 case 'confirm-publish':{const next=M.clone(data);next.plan={sourceRevision:data.revision,publishedAt:new Date().toISOString(),tasks:trackedItems().filter(e=>data.checks[e.id]==='low').map(e=>({id:e.id,name:e.name,type:e.type,ready:false,inputs:M.clone(e.inputs),dishes:[...new Set(uses(e.id).map(x=>x.dishId||x.id))]}))};next.revision++;commit(next);closeDialog();todayView='morning';render();notify('Example morning plan published');break;}
 case 'ready':{const next=M.clone(data),task=next.plan?.tasks.find(t=>t.id===id);if(task){task.ready=!task.ready;next.revision++;commit(next);render();}break;}
 }
 }catch(error){notify(error.message||'The change could not be applied. Your draft is kept.');}
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='table-search'){ctx().q=el.value;ctx().pinned=[];ctx().onlySelected=false;renderRows();}else if(el.id==='picker-query'){picker.q=el.value;renderPicker();}else if(el.dataset.amount||el.dataset.note){const id=currentId(),d=draft(id),part=d.value.inputs.find(p=>p.id===(el.dataset.amount||el.dataset.note));if(part){part[el.dataset.amount?'amount':'note']=el.value;persist();renderFooter();renderRows();}}else if(el.id==='composition-note'){draft(currentId()).value.notes=el.value;persist();renderFooter();renderRows();}});
document.addEventListener('change',event=>{const el=event.target;
 if(['scope-filter','status-filter','category-filter'].includes(el.id)){ctx()[el.id==='scope-filter'?'scope':el.id==='status-filter'?'status':'category']=el.value;ctx().pinned=[];ctx().onlySelected=false;renderRows();}
 else if(el.dataset.select){const c=ctx();c.selected=el.checked?[...new Set([...c.selected,el.dataset.select])]:c.selected.filter(id=>id!==el.dataset.select);renderRows();}
 else if(el.id==='select-all'){const ids=rows().map(e=>e.id);ctx().selected=el.checked?[...new Set([...ctx().selected,...ids])]:ctx().selected.filter(id=>!ids.includes(id));renderRows();}
 else if(el.id==='picker-type'){picker.type=el.value;renderPicker();}
 else if(el.dataset.pick){picker.selected=el.checked?[...new Set([...picker.selected,el.dataset.pick])]:picker.selected.filter(id=>id!==el.dataset.pick);renderPicker();}
 else if(el.id==='confirm-list'){draft(currentId()).value.confirmed=el.checked;persist();renderFooter();}
 else if(el.dataset.track){const next=M.clone(data);next.tracked=el.checked?[...new Set([...next.tracked,el.dataset.track])]:next.tracked.filter(id=>id!==el.dataset.track);next.revision++;commit(next);}
});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target,values=new FormData(form);try{
 if(form.id==='create-form'){const parent=form.dataset.parent?entity(form.dataset.parent):null,type=parent?'dish':values.get('type')||form.dataset.kind,id=(type==='dish'?'dish':type==='house'?'house':'ingredient')+'-demo-'+Date.now().toString(36);const name=String(values.get('name')).trim();const e={id,type,name:parent?parent.name:name,variant:parent?name:type==='dish'?'Standard':undefined,dishId:parent?parent.dishId:type==='dish'?id:undefined,category:parent?.category||String(values.get('category')||''),active:false,confirmed:false,inputs:[],notes:'',aliases:[],group:''};const next=M.saveEntity(data,id,e);commit(next);if(form.dataset.picker==='true'&&picker){const d=draft(picker.parent);d.value.inputs.push({id,amount:'',note:''});d.value.confirmed=false;persist();closeDialog();render();notify('New shared item added to your draft');}else{closeDialog();openInMenu(id);notify('Created in the prototype');}}
 else if(form.id==='metadata-form'){const id=form.dataset.id,e=entity(id),name=String(values.get('name')).trim();let next=data;if(e.type==='dish'){for(const sibling of all().filter(x=>x.type==='dish'&&x.dishId===e.dishId)){next=M.saveEntity(next,sibling.id,{name,category:String(values.get('category')),...(sibling.id===id?{variant:String(values.get('variant')).trim()}:{})});if(drafts[sibling.id])Object.assign(drafts[sibling.id].value,{name,category:String(values.get('category')),...(sibling.id===id?{variant:String(values.get('variant')).trim()}:{})});}}else{const patch={name,aliases:String(values.get('aliases')||'').split(',').map(s=>s.trim()).filter(Boolean),...(e.type==='ingredient'?{group:String(values.get('group')||'')}:{})};next=M.saveEntity(next,id,patch);if(drafts[id])Object.assign(drafts[id].value,patch);}commit(next);closeDialog();render();notify('Shared details updated');}
 else if(form.id==='group-form'){let next=data;for(const id of ctx().selected)next=M.saveEntity(next,id,{group:String(values.get('group')).trim()});saveSnapshot(next,'Ingredient group updated');closeDialog();render();}
 }catch(error){const el=$('form-error');if(el)el.textContent=error.message;else notify(error.message);}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&dialog){event.preventDefault();closeDialog();}else if(event.key==='/'&&!dialog&&!['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName)){event.preventDefault();$('table-search')?.focus();}else if(dialog&&event.key==='Tab'){const focusable=[...document.querySelectorAll('.dialog button,.dialog input,.dialog select,.dialog textarea')].filter(el=>!el.disabled&&el.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}});
window.addEventListener('beforeunload',persist);
window.addEventListener('openai:set_globals',event=>{const state=event.detail?.globals?.widgetState;if(state?.prototypeVersion===1&&state.data?.entities&&JSON.stringify(state.data)!==JSON.stringify(data)){data=M.clone(state.data);drafts=M.clone(state.drafts||{});render();}});
window.LabulaPrototype={getData:()=>M.clone(data),getDrafts:()=>M.clone(drafts),getContext:()=>({area,tab,context:M.clone(ctx())})};
render();
})();
</script>
</body></html>
